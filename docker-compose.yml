services:

  postgres:
    image: postgres:18
    container_name: xyz-postgres
    environment:
      POSTGRES_DB: energy_station
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d energy_station"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - xyz-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: xyz-mosquitto
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -p 1883 -t healthcheck -m ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - xyz-network

  simulateur:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xyz-simulateur
    environment:
      XYZ_DB_CONNECTION: "Host=postgres;Port=5432;Database=energy_station;Username=postgres;Password=postgres"
      XYZ_MQTT_HOST: "mosquitto"
      XYZ_MQTT_PORT: "1883"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - xyz-network

volumes:
  postgres_data:

networks:
  xyz-network:
    driver: bridge